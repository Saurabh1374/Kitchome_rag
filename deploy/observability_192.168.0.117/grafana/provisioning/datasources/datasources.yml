apiVersion: 1

datasources:
  # ----------------------------------------------------------------------------
  # 1. Prometheus Metrics Datasource
  # ----------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s

  # ----------------------------------------------------------------------------
  # 2. Loki Logs Datasource (with Logs-to-Trace correlation)
  # ----------------------------------------------------------------------------
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id\":\"([a-fA-F0-9]{32})\""
          url: "$${__value.raw}"
          datasourceUid: tempo

  # ----------------------------------------------------------------------------
  # 3. Tempo Tracing Datasource (with Trace-to-Logs correlation)
  # ----------------------------------------------------------------------------
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        tags: ["service", "job"]
        filterByTraceID: true
        filterBySpanID: false
        query: '{$${__tags}} |= "$${__trace.id}"'
