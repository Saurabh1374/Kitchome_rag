version: "3.8"

networks:
  observability_net:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

services:
  # ----------------------------------------------------------------------------
  # 1. Grafana - Visualization & Correlated Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: kitchome_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=warn
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability_net
    depends_on:
      - prometheus
      - loki
      - tempo

  # ----------------------------------------------------------------------------
  # 2. Prometheus - Time-Series Metric Scraper & TSDB
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kitchome_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability_net

  # ----------------------------------------------------------------------------
  # 3. Loki - High-Efficiency Log Aggregation Engine
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: kitchome_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - observability_net

  # ----------------------------------------------------------------------------
  # 4. Tempo - High-Scale Distributed Trace Storage
  # ----------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.1
    container_name: kitchome_tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP API & UI
      - "4317:4317"   # OTLP gRPC Receiver
      - "4318:4318"   # OTLP HTTP Receiver
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability_net
